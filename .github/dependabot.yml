# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
#
# Weekly pull requests for the pinned GitHub Actions, the ClusterFuzzLite
# base image, the site's npm packages and the hash-locked Python tools
# pkgs.yml installs (.github/pkgs). The library itself has no
# dependencies.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /.clusterfuzzlite
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /docs/site
    schedule:
      interval: weekly
    groups:
      site:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /.github/pkgs
    schedule:
      interval: weekly
    groups:
      pkgs:
        patterns: ["*"]
