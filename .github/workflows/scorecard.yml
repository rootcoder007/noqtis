# SPDX-License-Identifier: LGPL-3.0-or-later
#
# OpenSSF Scorecard: checks the repository's supply-chain practices,
# publishes the result to the OpenSSF API (which serves the README badge)
# and uploads the findings to code scanning. Scorecard accepts a published
# result only from a workflow with no top-level env or defaults, on a
# GitHub-hosted Ubuntu runner, whose steps are only checkout, the
# scorecard action, upload-artifact and the code-scanning upload.
name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "23 5 * * 2"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      # the SARIF upload to code scanning
      security-events: write
      # the OIDC token that lets the OpenSSF API accept the published result
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
