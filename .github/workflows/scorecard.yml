# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
#
# OpenSSF Scorecard: checks the repository's supply-chain practices,
# publishes the result to the OpenSSF API (which serves the README badge)
# and uploads the findings to code scanning. Scorecard accepts a published
# result only from a workflow with no top-level env or defaults, on a
# GitHub-hosted Ubuntu runner, whose steps are only checkout, the
# scorecard action, upload-artifact and the code-scanning upload.
name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "23 5 * * 2"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # the SARIF upload to code scanning
      security-events: write
      # the OIDC token that lets the OpenSSF API accept the published result
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
