# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
#
# ClusterFuzzLite (.clusterfuzzlite/, the OSS-Fuzz build of
# fuzz/oss-fuzz/build.sh): on a pull request, the targets its change
# reaches are fuzzed for 5 minutes under ASan, UBSan and MSan, and a
# crash is reported in code scanning; every week each sanitizer fuzzes
# every target for an hour from the stored corpus, which then is pruned. The corpus and builds are kept as workflow
# artifacts. fuzz.yml still runs every target on every push.
name: cflite

on:
  pull_request:
    paths:
      - "src/**"
      - "include/**"
      - "cli/**"
      - "fuzz/**"
      - ".clusterfuzzlite/**"
      - ".github/workflows/cflite.yml"
  schedule:
    - cron: "23 5 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cflite-${{ github.ref }}-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  pr:
    if: github.event_name == 'pull_request'
    name: pr ${{ matrix.sanitizer }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined, memory]
    steps:
      - uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: c
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: ${{ matrix.sanitizer }}
      - uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: code-change
          sanitizer: ${{ matrix.sanitizer }}
          output-sarif: true
      - if: always() && hashFiles('sarif-results/*.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: sarif-results
          category: cflite-${{ matrix.sanitizer }}

  batch:
    if: github.event_name != 'pull_request'
    name: batch ${{ matrix.sanitizer }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined, memory]
    steps:
      - uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: c
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: ${{ matrix.sanitizer }}
          upload-build: true
      - uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 3600
          mode: batch
          sanitizer: ${{ matrix.sanitizer }}

  prune:
    needs: batch
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    steps:
      - uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: c
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: prune

