# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
#
# The npm package (bindings/npm): builds the library to WebAssembly with
# the pinned emsdk, runs the package's tests on Node 22, 24 and 26 (with
# the native CLI built beside it for the cross-checks) and the smoke test
# on Deno and Bun, type-checks the declarations and dry-runs `npm pack`.
# On a release tag of a public repository, publishes to npm with
# provenance once every test passes; while the repository is private the
# publish job is skipped.
name: npm

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    paths:
      - "bindings/npm/**"
      - "src/**"
      - "include/**"
      - "docs/site/src/content/docs/guides/js.md"
      - "docs/examples/guide.py"
      - "cli/**"
      - "tests/vectors/cap/**"
      - ".github/workflows/npm.yml"
  pull_request:
    paths:
      - "bindings/npm/**"
      - "src/**"
      - "include/**"
      - "docs/site/src/content/docs/guides/js.md"
      - "docs/examples/guide.py"
      - "cli/**"
      - "tests/vectors/cap/**"
      - ".github/workflows/npm.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-${{ github.ref }}-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

env:
  EMSDK_VERSION: "6.0.12"

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: build the WebAssembly module
        run: sh bindings/npm/build.sh
      - name: build the native CLI for the cross-checks
        run: |
          cmake -S . -B native -DCMAKE_BUILD_TYPE=Release -DNQTESTS=OFF
          cmake --build native -j4
      - name: tests
        working-directory: bindings/npm
        env:
          NOQTIS_CLI: ${{ github.workspace }}/native/bin/noqtis
        run: npm test
      - name: the JavaScript guide prints what its page shows
        run: python3 docs/examples/guide.py js
      - name: type declarations
        if: matrix.node == '22'
        working-directory: bindings/npm
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run types
      - name: package contents
        working-directory: bindings/npm
        run: npm pack --dry-run

  runtimes:
    # the same WebAssembly module on Deno and Bun: test/smoke.js signs,
    # verifies, encapsulates, hashes and seals and checks a capsule
    name: ${{ matrix.rt }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        rt: [deno, bun]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache
      - name: build the WebAssembly module
        run: sh bindings/npm/build.sh
      - if: matrix.rt == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7
      - if: matrix.rt == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: smoke test
        working-directory: bindings/npm
        env:
          RT: ${{ matrix.rt }}
        run: |
          if [ "$RT" = deno ]; then
            deno run --allow-read test/smoke.js
          else
            bun test/smoke.js
          fi

  publish:
    # release tags only, and never while the repository is private
    if: >
      startsWith(github.ref, 'refs/tags/v') &&
      !github.event.repository.private
    needs: [test, runtimes]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance (Sigstore)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: build the WebAssembly module
        run: sh bindings/npm/build.sh
      - name: the tag matches the package version
        working-directory: bindings/npm
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(node -p 'require("./package.json").version')
          test "$want" = "$have" || {
            echo "tag $GITHUB_REF_NAME, package.json $have" >&2; exit 1; }
      - name: publish
        working-directory: bindings/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
