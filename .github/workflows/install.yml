# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
#
# Tests install.sh (Linux, macOS) and install.ps1 (Windows) on clean
# runners, before any real release exists: a build job makes this tree's
# release archives with packaging/dist.sh, as release.yml does; a fresh
# runner per OS then serves them as a fake release on localhost
# (packaging/fakerel.sh) and runs packaging/insttest.sh or insttest.ps1:
# good installs, and a tampered archive, an archive missing from
# SHA256SUMS, a required cosign that is absent, a bad Sigstore bundle
# with cosign present, and a non-https URL, each of which must be
# refused with nothing installed. The fake release has no valid Sigstore
# bundle (keyless signing needs the release workflow's identity), so the
# good installs run without the Sigstore check, as the scripts say.
name: install

on:
  push:
    branches: [main]
    paths:
      - "install.sh"
      - "install.ps1"
      - "packaging/dist.sh"
      - "packaging/pack.py"
      - "packaging/fakerel.sh"
      - "packaging/insttest.*"
      - "CMakeLists.txt"
      - ".github/workflows/install.yml"
  pull_request:
    paths:
      - "install.sh"
      - "install.ps1"
      - "packaging/dist.sh"
      - "packaging/pack.py"
      - "packaging/fakerel.sh"
      - "packaging/insttest.*"
      - "CMakeLists.txt"
      - ".github/workflows/install.yml"
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-${{ github.ref }}-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: archives ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, targets: "linux-x86_64 linux-x86_64-shared", py: python3 }
          - { os: macos-15, targets: macos-arm64, py: python3 }
          - { os: windows-2025, targets: windows-x86_64, py: python }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: archives
        env:
          PY: ${{ matrix.py }}
          NQJOBS: "4"
          TS: ${{ matrix.targets }}
        run: |
          for t in $TS; do packaging/dist.sh "$t" dist; done
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inst-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  sh:
    name: install.sh ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: inst-${{ matrix.os }}
          path: dist
      - name: no noqtis or cosign on this runner before the test
        run: |
          for c in noqtis cosign; do
            if command -v "$c"; then echo "::error::$c is already here"; exit 1; fi
          done
      - name: install.sh, good and refused cases (no cosign)
        run: packaging/insttest.sh dist "$RUNNER_TEMP/it"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: matrix.os == 'ubuntu-24.04'
        with:
          cosign-release: v3.1.4
      - name: install.sh with cosign present (missing and bad bundles refused)
        if: matrix.os == 'ubuntu-24.04'
        env:
          NQPORT: "8472"
        run: |
          command -v cosign
          packaging/insttest.sh dist "$RUNNER_TEMP/it2"

  ps:
    name: install.ps1 windows-2025
    needs: build
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: inst-windows-2025
          path: dist
      - name: fake releases
        shell: bash
        run: |
          # a release key for the fake releases (install.ps1 trusts it
          # through NOQTIS_SSHKEY)
          ssh-keygen -q -t ed25519 -N "" -C test -f "$RUNNER_TEMP/tk"
          export NQTESTKEY="$RUNNER_TEMP/tk"
          for m in ok tamper nosum; do
            packaging/fakerel.sh dist "$RUNNER_TEMP/srv/$m" "$m"
          done
          printf 'noqtis %s\n' "$(cut -d' ' -f1,2 "$RUNNER_TEMP/tk.pub")" > "$RUNNER_TEMP/tk.line"
      - name: install.ps1, good and refused cases
        shell: pwsh
        run: |
          if (Get-Command noqtis -ErrorAction SilentlyContinue) { throw 'noqtis is already on PATH' }
          $env:NOQTIS_SSHKEY = (Get-Content -Raw "$env:RUNNER_TEMP\tk.line").Trim()
          $srv = Start-Process python -PassThru -NoNewWindow -ArgumentList @(
            '-m', 'http.server', '8471', '--bind', '127.0.0.1',
            '--directory', "$env:RUNNER_TEMP\srv")
          try {
            $up = $false
            for ($i = 0; $i -lt 50 -and -not $up; $i++) {
              try {
                $null = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8471/ok/latest/download/SHA256SUMS
                $up = $true
              } catch { Start-Sleep -Milliseconds 200 }
            }
            if (-not $up) { throw 'the test server did not start' }
            pwsh -NoProfile -File packaging/insttest.ps1 "$env:RUNNER_TEMP\srv" "$env:RUNNER_TEMP\it"
            if ($LASTEXITCODE -ne 0) { throw 'install.ps1 tests failed' }
          } finally {
            Stop-Process -Id $srv.Id -ErrorAction SilentlyContinue
          }
