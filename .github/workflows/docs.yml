# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
#
# The documentation: lints the manual pages (mandoc), runs every example
# of the manual pages and the site against the built library and tool,
# builds the WebAssembly module for the site's in-browser capsule check,
# builds the Astro Starlight site (with its internal link check) and, for
# a push to main or a release, publishes it on GitHub Pages. Publishing
# runs only once the repository is public; until then the built site is
# kept as the run's Pages artifact.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "bindings/npm/**"
      - "tests/vectors/cap/**"
      - "man/**"
      - "cli/**"
      - "include/**"
      - "src/**"
      - "CMakeLists.txt"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "bindings/npm/**"
      - "tests/vectors/cap/**"
      - "man/**"
      - "cli/**"
      - "include/**"
      - "src/**"
      - "CMakeLists.txt"
      - ".github/workflows/docs.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  man:
    name: manual pages (mandoc -T lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y mandoc
      - name: lint every page (warnings fail)
        run: |
          out=$(mandoc -T lint -W warning man/*.1 man/*.3 man/*.5 2>&1) || true
          if [ -n "$out" ]; then
            printf '%s\n' "$out"
            exit 1
          fi
          echo "$(ls man | wc -l) pages, no warnings"

  examples:
    name: examples (CLI and C)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build and install (library, tool, manual pages)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNQTESTS=OFF
          cmake --build build -j4
          cmake --install build --prefix "$RUNNER_TEMP/nq"
          test -f "$RUNNER_TEMP/nq/share/man/man3/nqvrfy.3"
          test -f "$RUNNER_TEMP/nq/share/man/man5/noqtis-capsule.5"
      - name: every command-line example
        run: sh docs/examples/cli.sh "$RUNNER_TEMP/nq/bin/noqtis"
      - name: every C example, compiled with -Werror and run
        run: sh docs/examples/c.sh "$RUNNER_TEMP/nq"
      - name: the README demo (docs/demo/demo.sh) still ends in a failed check
        run: |
          out=$(NQFAST=1 sh docs/demo/demo.sh "$RUNNER_TEMP/nq/bin/noqtis")
          printf '%s\n' "$out" | grep -q '^results: OK (22 checks passed)$'
          printf '%s\n' "$out" | grep -q '^FAIL  file  *report.txt: sha256 differs$'
          test "$(printf '%s\n' "$out" | tail -n 1)" = "exit status 1"
      - name: man finds the installed pages
        run: |
          MANPATH="$RUNNER_TEMP/nq/share/man" man -w nqsign nqvrfy noqtis-seal \
            noqtis-capsule

  site:
    name: site (Astro Starlight)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: "6.0.12" # as npm.yml
          actions-cache-folder: emsdk-cache
      - name: build the WebAssembly module (for the browser check page)
        working-directory: .
        run: sh bindings/npm/build.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y mandoc
      - run: npm ci --no-audit --no-fund
      - name: render the manual pages into the site
        run: npm run man
      - name: build (fails on a broken internal link)
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
          NQWASM: "1" # the page's WebAssembly module must be there
        run: npm run build
      - name: the browser check page and its files are in the site
        run: |
          test -f dist/demo/index.html
          test -f dist/wasm/dist/noqtis.wasm
          test -f dist/wasm/lib/index.js
          test -f dist/sample.json
      - name: size
        run: du -sh dist && find dist -type f | wc -l
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site/dist

  deploy:
    name: publish on GitHub Pages
    needs: [man, examples, site]
    if: >-
      github.event.repository.private == false &&
      (github.event_name == 'release' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
