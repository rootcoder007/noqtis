# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
#
# Static analysis: CodeQL over the C library and the command-line tool on
# every push and pull request and weekly, with the security-extended
# queries. Findings appear under Security > Code scanning.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # a push to main replaces the run of an older main commit still waiting
  # (it tests that commit too); tags, releases and pull requests always
  # run to the end
  group: codeql-${{ github.ref }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'tip' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  analyze:
    name: CodeQL (C)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
      - name: build
        # tests off: CodeQL reads the library and the CLI as users build them
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DNQTESTS=OFF
          cmake --build build -j4
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:c-cpp"
