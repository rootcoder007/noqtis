#
# Static analysis: CodeQL over the C library and the command-line tool on
# every push and pull request and weekly, with the security-extended
# queries. Findings appear under Security > Code scanning.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # every commit of main is scanned to the end, as tags, releases and pull
  # requests are: a run replaced by a newer push left its commit unscanned
  # (OpenSSF Scorecard, SAST)
  group: codeql-${{ github.ref }}-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  analyze:
    name: CodeQL (C)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
      - name: build
        # tests off: CodeQL reads the library and the CLI as users build them
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DNQTESTS=OFF
          cmake --build build -j4
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:c-cpp"
